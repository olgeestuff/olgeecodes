# Hook 6 "before hiring" - realistic human version with the real Gemini Veo videos of Marcus & Jay.
# When the Veo videos arrive, swap each `file:` to "raw footage/veo/hook 6 veo scene K.mp4" and add the crop.
title: "Before You Hire A Temp…"
subtitle: "Snap It. It's In Your Sheet."
prompt: "So, before you hire someone to start typing stuff randomly in your data, just watch this. Photo, and it rolls out. No typing, no AI credits, no production fees. Just comment SORTED and I'll show you what this looks like with your paperwork."
end_after: "your paperwork"
segments:
  - at: "so"                       # Marcus drops another stack on Jay, who is buried in paper
    file: raw footage/veo/gemini_generated_video_pt1.mp4
    src: 0
    crop: [186, 0, 907, 720]
  - at: "just watch"               # "watch this": Marcus snaps the invoice with his phone
    file: raw footage/veo/gemini_generated_video_pt2.mp4
    src: 0
    crop: [186, 0, 907, 720]
  - at: "rolls"                    # real proof: the row lands in the sheet
    src: 25
    crop: [0, 330, 900, 714]
  - at: "no typing"                # relaxed office, coffee, Jay laughing
    file: raw footage/veo/gemini_generated_video_pt3.mp4
    src: 0
    crop: [186, 0, 907, 720]
  - at: "no production"            # quick face cut on the last benefit
    full: true
  - at: "comment"                  # full sheet
    src: 68
    crop: [0, 330, 900, 714]
